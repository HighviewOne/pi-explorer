<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <!-- Background gradient -->
    <radialGradient id="lgBg" cx="45%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#321b00"/>
      <stop offset="100%" stop-color="#090400"/>
    </radialGradient>

    <!-- Glow for the pi symbol -->
    <filter id="piGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for the outer ring -->
    <filter id="ringGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bottom arc path for curved "PI EXPLORER" text -->
    <path id="lgBot" d="M 22,100 A 78,78 0 0,1 178,100"/>

  </defs>

  <!-- ── Background ── -->
  <circle cx="100" cy="100" r="99" fill="url(#lgBg)"/>

  <!-- ── Decorative rings ── -->
  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c9a227" stroke-width="1.8"
          filter="url(#ringGlow)"/>
  <!-- Dashed ornamental ring -->
  <circle cx="100" cy="100" r="89" fill="none" stroke="#c9a227" stroke-width="1"
          stroke-dasharray="3.8 4.6" opacity="0.55"/>
  <!-- Inner solid ring -->
  <circle cx="100" cy="100" r="83" fill="none" stroke="#c9a227" stroke-width="1"/>

  <!-- ── Cardinal ornaments ── -->
  <!-- Top diamond -->
  <polygon points="100,13  104,21  100,29  96,21" fill="#c9a227" opacity="0.9"/>
  <!-- Bottom diamond -->
  <polygon points="100,171 104,179 100,187 96,179" fill="#c9a227" opacity="0.9"/>
  <!-- Left ankh -->
  <text x="18" y="107" text-anchor="middle" font-size="18"
        font-family="serif" fill="#c9a227" opacity="0.78">☥</text>
  <!-- Right ankh -->
  <text x="182" y="107" text-anchor="middle" font-size="18"
        font-family="serif" fill="#c9a227" opacity="0.78">☥</text>

  <!-- ── Short centre-line ornaments ── -->
  <line x1="26" y1="100" x2="58"  y2="100" stroke="#c9a227" stroke-width="0.9" opacity="0.38"/>
  <line x1="142" y1="100" x2="174" y2="100" stroke="#c9a227" stroke-width="0.9" opacity="0.38"/>

  <!-- ── Digit string above the pi symbol ── -->
  <text x="100" y="53" text-anchor="middle"
        font-family="Georgia, serif" font-size="9"
        fill="#c9a227" opacity="0.72" letter-spacing="2">3.14159265358979...</text>

  <!-- ── π — the centrepiece ── -->
  <text x="100" y="124" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82" font-weight="bold"
        fill="#f0c840" filter="url(#piGlow)">π</text>

  <!-- ── "PI EXPLORER" curved along the bottom ── -->
  <text font-family="Cinzel, Georgia, serif" font-size="11"
        fill="#c9a227" letter-spacing="4">
    <textPath href="#lgBot" startOffset="50%" text-anchor="middle">PI EXPLORER</textPath>
  </text>

</svg>
